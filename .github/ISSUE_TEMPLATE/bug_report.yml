name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect the adapter
        2. Press Auslesen
        3. ...
  - type: input
    id: version
    attributes:
      label: Open OBD GUI version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.1"
  - type: input
    id: setup
    attributes:
      label: Adapter and vehicle
      placeholder: "OBDLink EX, Ford Focus IV 2020, 1.5 EcoBoost, or simulator"
  - type: textarea
    id: output
    attributes:
      label: Output or logs
      description: Output of `openobd ... --json` or the workshop traffic helps a lot. Replace your VIN before posting.
      render: shell
